# Copy to .github/workflows/publish-live.yml to activate.
name: Publish game
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: live-game
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Download Godot and matching templates
        shell: bash
        run: |
          mkdir -p live/.cache/templates
          curl --fail --location --retry 3 -o live/.cache/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q live/.cache/godot.zip -d live/.cache
          chmod +x live/.cache/Godot_v4.7.2-stable_linux.x86_64
          curl --fail --location --retry 3 -o live/.cache/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -j -q live/.cache/templates.tpz templates/web_nothreads_release.zip templates/windows_release_x86_64.exe templates/macos.zip templates/version.txt -d live/.cache/templates
      - name: Build copies of the game
        run: python3 live/build.py --godot live/.cache/Godot_v4.7.2-stable_linux.x86_64 --templates live/.cache/templates
      - name: Publish desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_TAG: live-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          gh release create "$LIVE_TAG" live/dist/downloads/*.zip --target "$GITHUB_SHA" --title "Game download $LIVE_TAG" --notes "Windows and universal Mac game builds. Mac is not notarized and has no voice chat. Browser play is experimental."
          python3 - <<'PY'
          import json, os, pathlib, shutil
          path = pathlib.Path('live/dist/builds.json')
          builds = json.loads(path.read_text())
          for platform in ('windows', 'macos'):
              builds[platform] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['LIVE_TAG']}/MarsColony-{platform}.zip"
          path.write_text(json.dumps(builds, indent=2) + '\n')
          shutil.rmtree('live/dist/downloads')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
